services:
  - type: web
    name: secure-file-sharing-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secure-file-sharing-db
          property: connectionString
      - key: RESET_DATABASE_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: "local"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: FRONTEND_URL
        value: "https://secure-file-sharing-with-encryption-tau.vercel.app"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "securefilesharing303.project@gmail.com"
      - key: SMTP_FROM
        value: "securefilesharing303.project@gmail.com"
      - key: SMTP_USER
        value: "securefilesharing303.project@gmail.com"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TLS
        value: "true"
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: secure-file-sharing-db
    databaseName: secure_file_sharing
    user: sfs_admin
    region: oregon
    plan: free
